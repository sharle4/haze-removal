[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dehazing"
version = "0.1.0"
description = "Academic Python implementation of Single Image Haze Removal using Dark Channel Prior."
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Charles Kayssieh", email = "charleskayssieh@gmail.com"}]
dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "Pillow>=9.0.0",
    "PyYAML>=6.0",
    "tqdm>=4.60.0",
    "scikit-image>=0.18.0",
    "pandas>=1.3.0",
    "matplotlib>=3.4.0",
    "seaborn>=0.11.0",
    "opencv-python>=4.5.0"
]